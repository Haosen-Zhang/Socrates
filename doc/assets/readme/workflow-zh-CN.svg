<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="290" viewBox="0 0 1600 290" role="img" aria-label="讨论、计划、审批、执行、审核"><title>讨论、计划、审批、执行、审核</title><defs><radialGradient id="glow"><stop stop-color="#294432" stop-opacity=".65"/><stop offset="1" stop-color="#111913" stop-opacity="0"/></radialGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#556450" opacity=".22"/></pattern></defs><rect width="1600" height="290" rx="18" fill="#111813"/><rect width="1600" height="290" rx="18" fill="url(#grid)"/><g fill="#f2f3e9" font-family="'Avenir Next', 'Segoe UI', 'PingFang SC', sans-serif"><text x="64" y="60" font-size="15" fill="#b7ccab" letter-spacing="3">WORK / 从想法到交付</text><path d="M84 143L1504 143" fill="none" stroke="#34443b" stroke-width="2"/><circle cx="84" cy="143" r="23" fill="#1d2a20" stroke="#6f8f5e"/><text x="84" y="150" font-size="18" text-anchor="middle" fill="#c4f778">1</text><text x="84" y="207" font-size="25" text-anchor="start" font-weight="600">讨论</text><text x="84" y="243" font-size="17" text-anchor="start" fill="#adbca5">汇集成员意见</text><circle cx="434" cy="143" r="23" fill="#1d2a20" stroke="#6f8f5e"/><text x="434" y="150" font-size="18" text-anchor="middle" fill="#c4f778">2</text><text x="434" y="207" font-size="25" text-anchor="middle" font-weight="600">拆分工作包</text><text x="434" y="243" font-size="17" text-anchor="middle" fill="#adbca5">Manager 分配责任</text><circle cx="784" cy="143" r="23" fill="#c4f778" stroke="#6f8f5e"/><text x="784" y="150" font-size="18" text-anchor="middle" fill="#111813">3</text><text x="784" y="207" font-size="25" text-anchor="middle" font-weight="600">批准计划</text><text x="784" y="243" font-size="17" text-anchor="middle" fill="#adbca5">由你掌握决定权</text><circle cx="1134" cy="143" r="23" fill="#1d2a20" stroke="#6f8f5e"/><text x="1134" y="150" font-size="18" text-anchor="middle" fill="#c4f778">4</text><text x="1134" y="207" font-size="25" text-anchor="middle" font-weight="600">成员执行</text><text x="1134" y="243" font-size="17" text-anchor="middle" fill="#adbca5">在本地工作区处理</text><circle cx="1484" cy="143" r="23" fill="#1d2a20" stroke="#6f8f5e"/><text x="1484" y="150" font-size="18" text-anchor="middle" fill="#c4f778">5</text><text x="1484" y="207" font-size="25" text-anchor="end" font-weight="600">可选审核</text><text x="1484" y="243" font-size="17" text-anchor="end" fill="#adbca5">检查结果与返工</text></g></svg>